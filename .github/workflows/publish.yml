name: Publish

# Stages a release on npm when a version tag (v1.2.3) is pushed. It authenticates with npm trusted publishing
# (OIDC, no token), and the trusted publisher allows staging only, so nothing goes live until a maintainer
# approves it with 2FA. See RELEASING.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) and provenance

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse a tag that doesn't point at a commit on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Tag a commit on main."
            exit 1
          fi

      - name: Refuse a tag that doesn't match package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($expected)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # staged publishing needs Node 22.14.0 or newer; 22 resolves to the latest 22.x
          cache: npm
          registry-url: https://registry.npmjs.org

      # npm stage needs npm 11.15.0 or newer, and Node 22 ships npm 10.
      - run: npm install -g npm@^11.15.0
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run typecheck
      - run: npm test
      # Build before staging: npm reads the bin entry (dist/index.js) before prepublishOnly runs.
      - run: npm run build
      - run: npm stage publish --access public --provenance
